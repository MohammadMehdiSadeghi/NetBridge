name: Windows Desktop

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build check
        run: npm run build

      - name: Smoke + contract tests
        working-directory: .
        shell: bash
        run: |
          ./desktop/node_modules/.bin/tsc desktop/src/main/proxyChain.ts \
            --outDir desktop/.smoke --module commonjs --target es2022 \
            --esModuleInterop --skipLibCheck
          node tools/smoke-test.mjs
          node tools/contract-test.mjs

      - name: Package NSIS installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetBridge-Setup
          path: desktop/release/NetBridge Setup *.exe
          if-no-files-found: error
          retention-days: 14
