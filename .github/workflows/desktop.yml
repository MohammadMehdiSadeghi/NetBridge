name: Windows Desktop

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build check
        run: npm run build

      - name: Smoke + contract tests
        working-directory: .
        shell: pwsh
        run: |
          node desktop/node_modules/typescript/bin/tsc desktop/src/main/proxyChain.ts `
            --outDir desktop/.smoke --module commonjs --target es2022 `
            --esModuleInterop --skipLibCheck
          if (-not (Test-Path desktop/.smoke/proxyChain.js)) { throw 'proxyChain.js missing' }
          node tools/smoke-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/contract-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable exe
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetBridge-Setup
          # Must match `portable.artifactName` in desktop/package.json, which is
          # "${productName}-Setup-${version}.${ext}" — not "NetBridge Setup *.exe".
          path: desktop/release/NetBridge-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/NetBridge-Setup-*.exe
          generate_release_notes: true
