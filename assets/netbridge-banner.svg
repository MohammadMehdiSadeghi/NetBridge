<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="280" cy="180" r="180" fill="#0284C7" fill-opacity="0.15" filter="url(#glow)" />
  <circle cx="1020" cy="420" r="220" fill="#10B981" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Central Badge/Logo Container -->
  <g transform="translate(640, 160)">
    <!-- Icon Circle -->
    <circle cx="0" cy="0" r="54" fill="#0F172A" stroke="#0284C7" stroke-width="3" />
    <!-- Link Icon -->
    <path d="M-16 -8 L-8 -16 C-1.5 -22.5 9 -22.5 15.5 -16 C22 -9.5 22 1 15.5 7.5 L10 13 M-10 -13 L-15.5 -7.5 C-22 -1 -22 9.5 -15.5 16 C-9 22.5 1.5 22.5 8 16 L16 8 M-9 9 L9 -9"
          stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="640" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#F8FAFC" letter-spacing="-0.02em">
    NetBridge
  </text>
  <text x="640" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="22" fill="#38BDF8">
    Share Phone VPN Internet to Windows PC
  </text>
  <text x="640" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Vazirmatn', Roboto, Tahoma, sans-serif" font-weight="500" font-size="17" fill="#94A3B8">
    اشتراک اینترنت گوشی همراه با اعمال کامل VPN روی ویندوز • بدون نیاز به روت
  </text>

  <!-- Feature Cards / Badges -->
  <g transform="translate(160, 430)">
    <!-- Card 1: Zero Root -->
    <rect x="0" y="0" width="210" height="95" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#38BDF8">⚡ No Root Required</text>
    <text x="105" y="68" text-anchor="middle" font-family="-apple-system, 'Vazirmatn', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">بدون نیاز به روت گوشی</text>

    <!-- Card 2: Hotspot & USB -->
    <rect x="250" y="0" width="210" height="95" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="355" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#34D399">🔌 USB &amp; Hotspot</text>
    <text x="355" y="68" text-anchor="middle" font-family="-apple-system, 'Vazirmatn', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">پشتیبانی کامل کابل و وای‌فای</text>

    <!-- Card 3: Auto Proxy -->
    <rect x="500" y="0" width="210" height="95" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="605" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#38BDF8">🛡️ Auto System Proxy</text>
    <text x="605" y="68" text-anchor="middle" font-family="-apple-system, 'Vazirmatn', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">تنظیم خودکار پروکسی ویندوز</text>

    <!-- Card 4: High Speed -->
    <rect x="750" y="0" width="210" height="95" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="855" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#34D399">🚀 High Performance</text>
    <text x="855" y="68" text-anchor="middle" font-family="-apple-system, 'Vazirmatn', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">سرعت بالا و بدون تأخیر</text>
  </g>

  <!-- Bottom Footer Tag -->
  <text x="640" y="585" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="500" font-size="14" fill="#64748B">
    Developed with ❤️ by Mohammad Mehdi Sadeghi • Open Source (MIT)
  </text>
</svg>
